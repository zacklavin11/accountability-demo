<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Accountability Tool — Walkthrough</title>
<meta name="robots" content="noindex">
<!-- This file never changes. It exists so the walkthrough itself is never
     served from a stale browser cache: GitHub Pages sends HTML with
     max-age=600, so an updated page would keep showing the old copy for up
     to ten minutes. This shell asks for app.html with a fresh query string
     and no-store every single load, then swaps it in. -->
<style>
  html,body{margin:0;height:100%;background:#12100e;color:#8d857a;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #l{display:flex;align-items:center;justify-content:center;height:100%}
</style>
</head>
<body>
<div id="l">Loading&hellip;</div>
<script>
(function () {
  var url = 'app.html?v=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      // If fetch is blocked for any reason, fall back to a plain navigation.
      location.replace(url);
    });
})();
</script>
</body>
</html>
